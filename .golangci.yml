version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - goconst
  settings:
    goconst:
      # Test fixtures intentionally repeat literal strings; extracting them
      # into constants hurts readability more than it helps.
      ignore-tests: true
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
run:
  timeout: 3m

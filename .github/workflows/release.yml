name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all targets
        run: make build-all

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tmux-process-monitor-linux-amd64
            dist/tmux-process-monitor-linux-arm64
            dist/tmux-process-monitor-darwin-amd64
            dist/tmux-process-monitor-darwin-arm64
          generate_release_notes: true
